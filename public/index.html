<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Last.fm User vs Community</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <header>
            <h1>Last.fm Comparator</h1>
            <p>Discover your unusual favorites.</p>
        </header>

        <main>
            <form id="compareForm">
                <div class="input-group">
                    <label for="username">Last.fm Username</label>
                    <input type="text" id="username" placeholder="e.g. rj" value="JackMan3141" required>
                </div>

                <div class="input-group">
                    <label for="artist">Artist Name</label>
                    <input type="text" id="artist" placeholder="e.g. Radiohead" required>
                </div>

                <button type="submit">Compare</button>
            </form>

            <div id="loading" class="hidden">Parsing scrobbles...</div>
            <div id="error" class="hidden"></div>

            <div id="results" class="hidden">
                <h2 id="resultHeader"></h2>
                <div class="legend">
                    <span class="badge high">Unusual Favourite</span>
                    <span class="badge low">Community Favourite</span>
                </div>
                <div id="tracksList" class="tracks-grid">
                    <!-- Tracks will be injected here -->
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>

</html>
