<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Last.fm User vs Community</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <header>
            <h1>Last.fm Comparator</h1>
            <p>Discover your unusual favourites.</p>
        </header>

        <main>
            <div id="step1-user">
                <form id="userForm">
                    <div class="input-group">
                        <label for="username">Last.fm Username</label>
                        <div class="input-row">
                            <input type="text" id="username" placeholder="e.g. rj" required>
                            <button type="submit" id="checkUserBtn">Check User</button>
                        </div>
                    </div>
                </form>
            </div>

            <div id="userInfo" class="user-card hidden">
                <!-- User info injected here -->
            </div>

            <div id="step2-compare" class="hidden">
                <form id="compareForm">
                    <div class="input-group">
                        <label for="artist">Artist Name</label>
                        <div class="input-row">
                            <input type="text" id="artist" placeholder="e.g. Radiohead" required>
                            <button type="submit">Fetch & Compare</button>
                        </div>
                    </div>
                </form>
            </div>

            <div id="loading" class="progress-container hidden">
                <div class="progress-status">Parsing scrobbles...</div>
                <div class="progress-bar-bg">
                    <div id="progressBar" class="progress-bar-fill"></div>
                </div>
                <div class="progress-stats">
                    <span id="progressText">0%</span>
                    <span id="pagesText">Page 0 of 0</span>
                </div>
            </div>
            <div id="error" class="hidden"></div>

            <div id="results" class="hidden">
                <h2 id="resultHeader"></h2>
                <div class="legend">
                    <span class="badge high">Unusual Favourite</span>
                    <span class="badge low">Community Favourite</span>
                </div>
                <div id="tracksList" class="tracks-grid">
                    <!-- Tracks will be injected here -->
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>

</html>
