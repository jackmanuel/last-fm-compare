<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Last.fm User vs Community</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <header>
            <h1>Last.fm Comparator</h1>
            <p>Discover your unusual favourites.</p>
        </header>

        <main>
            <div id="step1-user">
                <form id="userForm">
                    <div class="input-group">
                        <label for="username">Last.fm Username</label>
                        <div class="input-row">
                            <input type="text" id="username" placeholder="e.g. rj" required>
                            <button type="submit" id="checkUserBtn">Check User</button>
                        </div>
                    </div>
                </form>
            </div>

            <div id="userInfo" class="user-card hidden">
                <!-- User info injected here -->
            </div>

            <div id="step-load-history" class="hidden" style="text-align: center; margin: 20px 0;">
                <button id="loadHistoryBtn" class="primary-btn">Load Scrobble History</button>
                <p class="hint-text">This will fetch all of your scrobbles. This may take a few minutes.</p>
            </div>

            <div id="step2-compare" class="hidden">
                <form id="compareForm">
                    <div class="input-group">
                        <label for="artist">Artist Name</label>
                        <div class="input-row">
                            <input type="text" id="artist" placeholder="e.g. Radiohead" required>
                            <button type="submit">Compare</button>
                        </div>
                    </div>

                </form>
            </div>

            <div id="loading" class="progress-container hidden">
                <div class="progress-status">Parsing scrobbles...</div>
                <div class="progress-bar-bg">
                    <div id="progressBar" class="progress-bar-fill"></div>
                </div>
                <div class="progress-stats">
                    <span id="progressText">0%</span>
                    <span id="pagesText">Page 0 of 0</span>
                </div>
            </div>
            <div id="error" class="hidden"></div>

            <div id="results" class="hidden">
                <h2 id="resultHeader"></h2>

                <!-- Filter Options -->
                <div class="filter-section" style="justify-content: flex-start; border-top: none; margin-bottom: 2rem;">
                    <div class="filter-row">
                        <input type="checkbox" id="filterEnabled" checked>
                        <label for="filterEnabled" class="inline-label">Hide low scrobbles</label>
                    </div>
                    <div class="filter-row" id="thresholdRow">
                        <label for="filterThreshold" class="inline-label">Min scrobbles:</label>
                        <input type="number" id="filterThreshold" value="5" min="1" max="100">
                    </div>
                </div>

                <div class="view-controls">
                    <button id="viewToggleBtn" class="secondary-btn">Show complete list</button>
                </div>
                <div id="tracksList" class="tracks-grid">
                    <!-- Tracks will be injected here -->
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>

</html>
